<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#090D14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F0F2F7" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Lean Bulk Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
:root{
  --bg:#F0F2F7; --card:#FFFFFF; --card2:#E4E7EF; --fg:#0D1017; --muted:#6B7280; --line:#D1D5E0;
  --prot:#0891B2; --carb:#D97706; --kcal:#E04343; --ok:#65C234;
  --acc:#BEFF3B; --acc2:#9DDB18;
  --glow:0 0 0 transparent;
  --f-display:"Space Grotesk",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#090D14; --card:#111827; --card2:#1A2235; --fg:#E8ECF4; --muted:#8892A6; --line:#252F40;
  --prot:#22D3EE; --carb:#FBBF24; --kcal:#F87171; --ok:#A3E635;
  --acc:#BEFF3B; --acc2:#9DDB18;
  --glow:0 0 24px rgba(190,255,59,.06);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090D14; --card:#111827; --card2:#1A2235; --fg:#E8ECF4; --muted:#8892A6; --line:#252F40;
  --prot:#22D3EE; --carb:#FBBF24; --kcal:#F87171; --ok:#A3E635;
  --acc:#BEFF3B; --acc2:#9DDB18;
  --glow:0 0 24px rgba(190,255,59,.06);
  color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding:env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px) 16px;padding-block:18px 40px}
.wrap{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
h1,h2,.num{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;margin:0}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--glow)}
.num,.tab{font-variant-numeric:tabular-nums}
.viewTog{display:inline-grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card2);padding:4px;border-radius:12px;align-self:center}
.viewTog button{border:0;background:transparent;border-radius:9px;padding:9px 22px;font-size:14px;font-weight:600;transition:background .15s,color .15s}
.viewTog button[aria-pressed="true"]{background:var(--acc);color:#0D1017;box-shadow:0 1px 4px rgba(190,255,59,.25)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:32px;line-height:1;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.dayNav{display:flex;align-items:center;justify-content:space-between;gap:6px}
.iconBtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:18px;transition:border-color .15s}
.iconBtn:hover{border-color:var(--acc)}
.dayLabel{min-width:104px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.05}
.dayLabel small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted)}
.todayBtn{font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--acc);background:transparent;color:var(--acc);font-weight:600;letter-spacing:.02em}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ring{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.ring svg{width:100%;max-width:112px;height:auto}
.ring .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.ring .left{font-size:13px;text-align:center}
.status{font-size:13px;color:var(--muted)}
.session{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.1}
.session small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted)}
.row{display:flex;flex-direction:column;gap:8px}
.rowHead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rowHead span{font-size:12px;color:var(--muted)}
.label{font-weight:600}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button,.chip{min-height:44px;padding:6px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:13px;font-weight:500;line-height:1.2;text-align:center;transition:all .15s}
.seg button[aria-pressed="true"]{background:var(--acc);color:#0D1017;border-color:var(--acc);font-weight:600}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center}
.chip small{font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--acc);color:#0D1017;border-color:var(--acc);font-weight:600}
.chip[aria-pressed="true"] small{color:#0D1017;opacity:.7}
.steppers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.step{display:flex;flex-direction:column;gap:6px;min-width:0}
.step .ctl{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--card2);overflow:hidden}
.step .ctl button{height:44px;border:0;background:transparent;font-size:20px;transition:background .1s}
.step .ctl button:active{background:var(--acc);color:#0D1017}
.step .ctl .num{text-align:center;font-size:26px}
.step .name{font-size:13px;display:flex;justify-content:space-between;gap:6px}
.step .name span{color:var(--muted)}
.bodyRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px}
input[type=number]{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card2);color:var(--fg);padding:0 12px;font:inherit;font-size:16px;box-sizing:border-box;transition:border-color .15s}
input[type=number]:focus{border-color:var(--acc)}
.hint{font-size:12px;color:var(--muted);margin:0}
.rule{height:1px;background:var(--line);border:0;margin:0}
.tabs{display:inline-grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--card2);padding:4px;border-radius:10px;align-self:flex-start}
.tabs button{border:0;background:transparent;border-radius:7px;padding:6px 12px;font-size:13px;font-weight:500;transition:all .15s}
.tabs button[aria-pressed="true"]{background:var(--acc);color:#0D1017;font-weight:600}
.chartBox{width:100%;overflow:hidden}
.chartBox svg{width:100%;height:auto;display:block}
.weightLine{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.weightLine .num{font-size:38px;line-height:1;letter-spacing:-.02em}
.delta{font-size:13px;color:var(--muted)}
details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
.tblWrap{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:13px}
th,td{padding:8px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.targets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.oatSeg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.oatSeg button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:13px;transition:all .15s}
.oatSeg button[aria-pressed="true"]{background:var(--acc);color:#0D1017;border-color:var(--acc);font-weight:600}
.note{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.ring circle.fg{transition:stroke-dashoffset .5s ease}}
@media (max-width:380px){.dayLabel{min-width:88px;font-size:18px}.top h1{font-size:26px}}
.gymList{display:flex;flex-direction:column;gap:10px}
.exRow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.exRow:last-child{border-bottom:0}
.exName{font-size:13px;font-weight:600;line-height:1.2}
.exMeta{font-size:11px;color:var(--muted)}
.exIn{width:64px;min-height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--fg);padding:0 8px;font:inherit;font-size:15px;text-align:center;box-sizing:border-box;transition:border-color .15s}
.exIn:focus{border-color:var(--acc)}
.exHdr{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em}
.gymHead{display:flex;justify-content:space-between;align-items:baseline}
.gymDone{font-size:13px;color:var(--ok);font-weight:600}
.calNav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calTitle{font-family:var(--f-display);font-weight:700;font-size:22px;text-align:center}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.calHdr{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:6px 0;font-weight:600}
.calCell{aspect-ratio:1;border-radius:12px;border:1px solid transparent;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:14px;font-weight:500;position:relative;min-height:44px;transition:border-color .15s}
.calCell:hover{border-color:var(--muted)}
.calCell.today{border-color:var(--acc);border-width:2px}
.calCell.sel{background:var(--acc);color:#0D1017;border-color:var(--acc);font-weight:700}
.calCell.empty{background:transparent;cursor:default}
.calDots{display:flex;gap:3px}
.calDots span{width:6px;height:6px;border-radius:50%}
.calSummary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.calStat{display:flex;flex-direction:column;gap:2px;padding:10px 0}
.calStat .num{font-size:30px;line-height:1;letter-spacing:-.02em}
.calStat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.calLegend{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--muted)}
.calLegend span{display:flex;align-items:center;gap:4px}
.calLegend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.exportBar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.exportBar button{padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:13px;font-weight:500;transition:all .15s}
.exportBar button:active{background:var(--acc);color:#0D1017}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div>
      <h1>Lean Bulk Log</h1>
      <div class="sub" id="weekSub"></div>
    </div>
  </div>

  <div class="viewTog" id="viewTog"></div>

  <!-- DAY VIEW -->
  <div id="dayView">
    <div class="dayNav" style="margin-bottom:14px">
      <button class="iconBtn" id="prev" aria-label="Previous day">&#8249;</button>
      <div class="dayLabel" id="dayLabel"></div>
      <button class="iconBtn" id="next" aria-label="Next day">&#8250;</button>
      <button class="todayBtn" id="today">Today</button>
    </div>

    <section class="card" aria-label="Daily totals">
      <div class="session" id="session"></div>
      <div class="rings" id="rings"></div>
      <div class="status" id="status"></div>
    </section>

    <section class="card" aria-label="Plate">
      <h2>Plate</h2>
      <div id="plate" style="display:flex;flex-direction:column;gap:14px"></div>
    </section>

    <section class="card" id="gymCard" aria-label="Workout">
      <div class="gymHead"><h2>Workout</h2><div class="gymDone" id="gymDone"></div></div>
      <div id="gymBody"></div>
    </section>

    <section class="card" aria-label="Last 7 days">
      <div class="rowHead"><h2>Last 7 days</h2></div>
      <div class="tabs" id="metricTabs"></div>
      <div class="chartBox" id="chart"></div>
      <p class="hint" id="chartHint"></p>
    </section>

    <section class="card" aria-label="Weight">
      <h2>Weight</h2>
      <div id="weight"></div>
    </section>

    <section class="card" aria-label="Foods and targets">
      <h2>Foods and targets</h2>
      <div id="ref"></div>
    </section>
  </div>

  <!-- MONTH VIEW -->
  <div id="monthView" hidden>
    <section class="card">
      <div class="calNav">
        <button class="iconBtn" id="calPrev" aria-label="Previous month">&#8249;</button>
        <div class="calTitle" id="calTitle"></div>
        <button class="iconBtn" id="calNext" aria-label="Next month">&#8250;</button>
      </div>
      <div class="calLegend">
        <span><i style="background:var(--ok)"></i> Gym</span>
        <span><i style="background:var(--prot)"></i> Diet logged</span>
        <span><i style="background:var(--kcal)"></i> Protein target hit</span>
      </div>
      <div class="calGrid" id="calGrid"></div>
    </section>
    <section class="card">
      <h2 id="calMonthLabel">This month</h2>
      <div class="calSummary" id="calSummary"></div>
    </section>
    <section class="card" id="calGymCard">
      <h2>Gym progress</h2>
      <div id="calGymProgress"></div>
    </section>
  </div>

  <!-- DATA MANAGEMENT -->
  <section class="card" aria-label="Data">
    <h2>Data</h2>
    <div class="exportBar">
      <button id="exportBtn">Export JSON</button>
      <button id="importBtn">Import JSON</button>
    </div>
    <input type="file" id="importFile" accept=".json" hidden>
    <p class="hint" style="text-align:center">Your data is stored locally on this device via IndexedDB.</p>
  </section>
</div>

<script>
(function(){
"use strict";
var FOODS_FIXED={
  eggs:{n:"Egg, 1 whole",p:6,c:1,k:72},
  milk:{n:"Amul Taaza 500 ml",p:16,c:25,k:290},
  chicken:{n:"Chicken breast 200 g raw",s:"Chicken 200g",p:46,c:0,k:230},
  soya:{n:"Bambino soya chunks 50 g dry",s:"Soya 50g",p:26,c:16,k:156},
  paneer:{n:"FruBon paneer 200 g",s:"Paneer 200g",p:48,c:8,k:346},
  rice:{n:"Rice 150 g cooked",p:4,c:42,k:195},
  roti:{n:"Roti, 1 medium",p:3,c:20,k:100},
  banana:{n:"Banana, 1 medium",p:1,c:27,k:105},
  pb:{n:"Peanut butter, 1 tbsp",p:4,c:3,k:95},
  dates:{n:"Dates, 1 piece",p:0,c:18,k:66},
  dal:{n:"Dal 50 g dry (moong/masoor)",s:"Dal 50g",p:12,c:30,k:170},
  peanuts:{n:"Peanuts, 30 g handful",p:8,c:5,k:170},
  mushroom:{n:"Mushroom 90 g",p:3,c:3,k:20}
};
var OATS={yu:{n:"Yu oats 100 g",p:25,c:50,k:404},reg:{n:"Regular oats 100 g",p:13,c:66,k:380}};
var SRC={eggs:"Estimate",oats_yu:"Protein and kcal from the app, carbs estimated",oats_reg:"Estimate",milk:"Estimate, the app shows no nutrition",
  chicken:"Estimate",soya:"Protein and kcal from the app, carbs estimated",paneer:"Protein and kcal from the app, carbs estimated",
  rice:"Estimate",roti:"Estimate, no ghee",banana:"Estimate",pb:"Estimate",dates:"Estimate, Medjool-size",dal:"Estimate, raw weight",peanuts:"Estimate",mushroom:"Estimate, raw"};
var SPLIT=["Rest","Chest + Biceps","Back + Triceps","Legs, quads","Shoulders + Abs","Legs, hamstrings and glutes","Rest"];
var MAINS=[["chicken","Chicken 200g"],["soya","Soya 50g"],["paneer","Paneer 200g"],["dal","Dal 50g"],["none","Skip"]];
var METRICS=[["p","Protein","g","--prot"],["c","Carbs","g","--carb"],["k","Calories","kcal","--kcal"]];

var GYM={
  1:[{id:"bench",n:"Barbell Bench Press",sets:4,reps:"5–8"},
     {id:"incdb",n:"Incline DB Press",sets:4,reps:"8–10"},
     {id:"cfly",n:"Cable Fly (low→high)",sets:3,reps:"12–15"},
     {id:"dips",n:"Dips / Machine Press",sets:3,reps:"8–12"},
     {id:"bbcurl",n:"BB/EZ-Bar Curl",sets:3,reps:"8–10"},
     {id:"inccurl",n:"Incline DB Curl",sets:3,reps:"10–12"},
     {id:"hammer",n:"Hammer Curl",sets:2,reps:"10–12"}],
  2:[{id:"dead",n:"Deadlift",sets:3,reps:"5"},
     {id:"pullup",n:"Weighted Pull-ups",sets:4,reps:"6–10"},
     {id:"csrow",n:"Chest-Supported Row",sets:3,reps:"8–10"},
     {id:"scrow",n:"Seated Cable Row",sets:3,reps:"10–12"},
     {id:"rpush",n:"Rope Tricep Pushdown",sets:3,reps:"10–12"},
     {id:"ohext",n:"OH Cable Extension",sets:3,reps:"10–12"},
     {id:"cgbp",n:"Close-Grip Bench",sets:3,reps:"8–10"}],
  3:[{id:"squat",n:"Back Squat",sets:4,reps:"5–8"},
     {id:"lpress",n:"Leg Press",sets:3,reps:"10–12"},
     {id:"lunge",n:"Walking Lunges",sets:3,reps:"10–12/leg"},
     {id:"legext",n:"Leg Extension",sets:3,reps:"12–15"},
     {id:"legcurl",n:"Lying Leg Curl",sets:3,reps:"10–12"},
     {id:"calf",n:"Standing Calf Raise",sets:4,reps:"10–15"}],
  4:[{id:"ohp",n:"Standing OHP",sets:4,reps:"6–8"},
     {id:"dbpress",n:"Seated DB Press",sets:3,reps:"8–10"},
     {id:"latrl",n:"Cable Lateral Raise",sets:4,reps:"15–20"},
     {id:"rdfly",n:"Rear Delt Fly",sets:3,reps:"15–20"},
     {id:"fpull",n:"Face Pull",sets:2,reps:"12–15"},
     {id:"hlr",n:"Hanging Leg Raise",sets:3,reps:"12–15"},
     {id:"ccrunch",n:"Cable Crunch",sets:3,reps:"12–15"}],
  5:[{id:"rdl",n:"Romanian Deadlift",sets:4,reps:"8–10"},
     {id:"fsquat",n:"Front / Hack Squat",sets:3,reps:"6–8"},
     {id:"bss",n:"Bulgarian Split Squat",sets:3,reps:"10–12/leg"},
     {id:"legcurl2",n:"Lying Leg Curl",sets:3,reps:"10–12"},
     {id:"calf2",n:"Standing Calf Raise",sets:4,reps:"12–15"}]
};

var state={targets:{p:130,c:330,k:2600},oats:"yu",days:{}};
var sel=ymd(new Date());
var metric="p";
var view="day";
var calY,calM;
var idb=null;

function ymd(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function parse(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function shift(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function $(id){return document.getElementById(id)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function defaultDay(){return{lunch:"none",dinner:"none",eggs:4,oats:true,milk:1,rice:0,roti:0,banana:0,pb:0,dates:0,peanuts:0,mushroom:0,weight:null,gym:false,ex:{}}}
function dayOf(s){return state.days[s]||defaultDay()}
function touch(s){if(!state.days[s])state.days[s]=defaultDay();if(!state.days[s].ex)state.days[s].ex={};return state.days[s]}
function oatsFood(){return OATS[state.oats]||OATS.yu}

function totals(d){
  var t={p:0,c:0,k:0};
  function add(f,n){t.p+=f.p*n;t.c+=f.c*n;t.k+=f.k*n}
  add(FOODS_FIXED.eggs,d.eggs||0);
  if(d.oats)add(oatsFood(),1);
  add(FOODS_FIXED.milk,d.milk||0);
  if(d.lunch&&FOODS_FIXED[d.lunch])add(FOODS_FIXED[d.lunch],1);
  if(d.dinner&&FOODS_FIXED[d.dinner])add(FOODS_FIXED[d.dinner],1);
  add(FOODS_FIXED.rice,d.rice||0);add(FOODS_FIXED.roti,d.roti||0);
  add(FOODS_FIXED.banana,d.banana||0);add(FOODS_FIXED.pb,d.pb||0);
  add(FOODS_FIXED.dates,d.dates||0);
  add(FOODS_FIXED.peanuts,d.peanuts||0);
  add(FOODS_FIXED.mushroom,d.mushroom||0);
  return t;
}

/* ---------- IndexedDB persistence ---------- */
function openDB(){
  return new Promise(function(resolve){
    try{
      var req=indexedDB.open("leanbulk",1);
      req.onupgradeneeded=function(e){e.target.result.createObjectStore("state")};
      req.onsuccess=function(e){idb=e.target.result;resolve(true)};
      req.onerror=function(){resolve(false)};
    }catch(e){resolve(false)}
  });
}
function idbLoad(){
  if(!idb)return Promise.resolve();
  return new Promise(function(resolve){
    try{
      var tx=idb.transaction("state","readonly");
      var req=tx.objectStore("state").get("data");
      req.onsuccess=function(){if(req.result)merge(req.result);resolve()};
      req.onerror=function(){resolve()};
    }catch(e){resolve()}
  });
}
function idbSave(){
  if(!idb)return;
  try{
    var tx=idb.transaction("state","readwrite");
    tx.objectStore("state").put(JSON.parse(JSON.stringify(state)),"data");
  }catch(e){}
}
// localStorage fallback
function lsLoad(){try{var s=localStorage.getItem("leanbulk");if(s)merge(JSON.parse(s))}catch(e){}}
function lsSave(){try{localStorage.setItem("leanbulk",JSON.stringify(state))}catch(e){}}
function merge(o){
  if(!o||typeof o!=="object")return;
  if(o.targets){["p","c","k"].forEach(function(k){var v=+o.targets[k];if(v>0)state.targets[k]=v})}
  if(o.oats&&OATS[o.oats])state.oats=o.oats;
  if(o.days&&typeof o.days==="object"){
    state.days=o.days;
    Object.keys(state.days).forEach(function(k){
      if(!state.days[k].ex)state.days[k].ex={};
      if(state.days[k].milk===true)state.days[k].milk=1;
      if(state.days[k].milk===false)state.days[k].milk=0;
      if(state.days[k].eggs===true)state.days[k].eggs=4;
      if(state.days[k].eggs===false)state.days[k].eggs=0;
    });
  }
}

function ring(label,val,target,colorVar,unit){

  var left=Math.round(target-val);
  var leftTxt=left>=0?left+" "+unit+" left":Math.abs(left)+" "+unit+" over";
  return '<div class="ring"><svg viewBox="0 0 100 100" role="img" aria-label="'+label+' '+Math.round(val)+' of '+target+' '+unit+'">'
   +'<circle cx="50" cy="50" r="'+r+'" fill="none" stroke="var(--card2)" stroke-width="8"/>'
   +'<circle class="fg" cx="50" cy="50" r="'+r+'" fill="none" stroke="var('+colorVar+')" stroke-width="8" stroke-linecap="round" transform="rotate(-90 50 50)" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/>'
   +'<text x="50" y="50" text-anchor="middle" dominant-baseline="central" font-family="var(--f-display)" font-weight="700" font-size="26" fill="var(--fg)">'+Math.round(val)+'</text>'
   +'<text x="50" y="68" text-anchor="middle" font-family="var(--f-body)" font-size="10" fill="var(--muted)">/ '+target+'</text></svg>'
   +'<div class="lbl">'+label+'</div><div class="left tab">'+leftTxt+'</div></div>';
}

function renderChart(){

    var t0=parse(pts[0].s).getTime(),t1=parse(pts[pts.length-1].s).getTime()||t0+1,span=Math.max(t1-t0,864e5);

function renderGymProgress(){
  var compounds=[
    {id:"bench",n:"Bench Press"},{id:"squat",n:"Back Squat"},{id:"dead",n:"Deadlift"},
    {id:"ohp",n:"OHP"},{id:"rdl",n:"Romanian DL"},{id:"pullup",n:"Pull-ups"}
  ];
  var best={};
  var daysInMonth=new Date(calY,calM+1,0).getDate();
  for(var day=1;day<=daysInMonth;day++){
    var ds=calY+"-"+(calM+1<10?"0":"")+(calM+1)+"-"+(day<10?"0":"")+day;
    var dd=state.days[ds];
    if(!dd||!dd.ex)continue;
    compounds.forEach(function(c){
      var e=dd.ex[c.id];
      if(e&&e.w>0){
        if(!best[c.id]||e.w>best[c.id].w||(e.w===best[c.id].w&&(e.r||0)>(best[c.id].r||0))){
          best[c.id]={w:e.w,r:e.r||0,d:ds};
        }
      }
    });
  }
  var any=Object.keys(best).length>0;
  if(!any){$("calGymCard").hidden=true;return}
  $("calGymCard").hidden=false;
  var h='<div class="gymList">';
  compounds.forEach(function(c){
    var b=best[c.id];if(!b)return;
    h+='<div style="display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)">'
     +'<div><div style="font-weight:600;font-size:14px">'+c.n+'</div></div>'
     +'<div style="text-align:right"><span class="num" style="font-size:22px">'+b.w+' kg</span>'
     +(b.r?' <span style="font-size:13px;color:var(--muted)">× '+b.r+'</span>':'')+'</div></div>';
  });

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var a=b.getAttribute("data-act"),k=b.getAttribute("data-k"),d;
  if(a==="view"){setView(b.getAttribute("data-v"));return}
  if(a==="calday"){sel=b.getAttribute("data-d");setView("day");renderAll();return}
  if(a==="main"){d=touch(sel);d[b.getAttribute("data-w")]=b.getAttribute("data-v")}
  else if(a==="base"){d=touch(sel);d[k]=!d[k]}
  else if(a==="inc"){d=touch(sel);d[k]=Math.min((d[k]||0)+1,+b.getAttribute("data-max"))}
  else if(a==="dec"){d=touch(sel);d[k]=Math.max((d[k]||0)-1,0)}
  else if(a==="gym"){d=touch(sel);d.gym=!d.gym}
  else if(a==="metric"){metric=b.getAttribute("data-m");renderTabs();renderChart();return}
  else if(a==="oats"){state.oats=b.getAttribute("data-v");save();renderAll();return}
  else return;
  save();renderRings();renderPlate();renderGym();renderHead();renderChart();renderWeight();
});
document.addEventListener("input",function(e){
  if(e.target.id==="wt"){
    var v=parseFloat(e.target.value),d=touch(sel);
    d.weight=(isFinite(v)&&v>0)?Math.round(v*10)/10:null;
    save();renderHead();renderWeight();renderChart();
  }
  var exid=e.target.getAttribute("data-exid");
  if(exid){
    var f=e.target.getAttribute("data-exf"),d2=touch(sel);
    if(!d2.ex)d2.ex={};if(!d2.ex[exid])d2.ex[exid]={w:"",r:""};
    var v2=parseFloat(e.target.value);
    d2.ex[exid][f]=(isFinite(v2)&&v2>0)?v2:"";
    save();renderGym();
  }
});
document.addEventListener("change",function(e){
  var t=e.target.getAttribute&&e.target.getAttribute("data-t");
  if(t){var v=Math.round(+e.target.value);if(v>0){state.targets[t]=v;save();renderRings();renderChart();renderRef()}else{e.target.value=state.targets[t]}}
});
$("prev").onclick=function(){sel=shift(sel,-1);renderAll()};
$("next").onclick=function(){sel=shift(sel,1);renderAll()};
$("today").onclick=function(){sel=ymd(new Date());renderAll()};
$("calPrev").onclick=function(){calM--;if(calM<0){calM=11;calY--}renderCal()};
$("calNext").onclick=function(){calM++;if(calM>11){calM=0;calY++}renderCal()};

/* ---------- boot ---------- */
lsLoad();
openDB().then(function(ok){
  if(ok)return idbLoad();
}).then(function(){renderAll()}).catch(function(){renderAll()});

if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
})();
</script>
